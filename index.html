<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>The Dugout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Theme matches the PA logo: black band, white type, one hot red. */
:root{
  --bg:#F3F3F4; --surface:#FFFFFF; --surface-2:#ECECEE; --ink:#0E0E10; --muted:#5C5C64; --line:#DADADF;
  --accent:#D0102C; --accent-ink:#FFFFFF; --accent-soft:#FCE4E7;
  --red:#D0102C; --red-soft:#FCE4E7;
  --band:#0A0A0B; --band-2:#000000; --band-ink:#FFFFFF; --band-muted:#A1A1A9; --chalk:#FFFFFF;
  --amber:#A8660F; --amber-soft:#F6E7CF;
  --good:#1F7A45; --good-soft:#DCF1E3; --warn:#94640D; --warn-soft:#F7EBCF; --bad:#9F1A24; --bad-soft:#F6DADC;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08080A; --surface:#131316; --surface-2:#1B1B1F; --ink:#F3F3F5; --muted:#9C9CA5; --line:#2A2A30;
  --accent:#E3203F; --accent-ink:#FFFFFF; --accent-soft:#3B1219;
  --red:#E3203F; --red-soft:#3B1219;
  --band:#000000; --band-2:#000000; --band-ink:#FFFFFF; --band-muted:#9C9CA5; --chalk:#FFFFFF;
  --amber:#E0A54E; --amber-soft:#3A2C16;
  --good:#6CC592; --good-soft:#173324; --warn:#E2B458; --warn-soft:#3A3018; --bad:#FF8A93; --bad-soft:#3E1C21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08080A; --surface:#131316; --surface-2:#1B1B1F; --ink:#F3F3F5; --muted:#9C9CA5; --line:#2A2A30;
  --accent:#E3203F; --accent-ink:#FFFFFF; --accent-soft:#3B1219;
  --red:#E3203F; --red-soft:#3B1219;
  --band:#000000; --band-2:#000000; --band-ink:#FFFFFF; --band-muted:#9C9CA5; --chalk:#FFFFFF;
  --amber:#E0A54E; --amber-soft:#3A2C16;
  --good:#6CC592; --good-soft:#173324; --warn:#E2B458; --warn-soft:#3A3018; --bad:#FF8A93; --bad-soft:#3E1C21; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink);border-bottom:4px solid var(--red);box-shadow:0 2px 12px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 6px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--band-ink)}
.logo-img{height:44px;width:auto;max-width:none;flex:none;display:block}
.logo .wm{padding-left:12px;border-left:2px solid var(--red)}
.logo .wm{display:flex;flex-direction:column;line-height:.9}
.logo .wm small{font-family:var(--f-display);font-weight:600;font-size:.78rem;letter-spacing:.16em;color:var(--band-muted);text-transform:uppercase}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:2.1rem;letter-spacing:.04em;margin:0;text-transform:uppercase;line-height:.95;color:var(--band-ink)}
.brand .meta{color:var(--band-muted);font-size:.82rem;display:flex;align-items:center;gap:6px}
.brand .meta::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.18)}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:1.02rem;letter-spacing:.05em;text-transform:uppercase;color:var(--band-muted);text-decoration:none;padding:8px 12px 8px;border-radius:6px 6px 0 0;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:#FFFFFF;background:var(--red)}
nav.tabs a:hover:not([aria-current="page"]){color:var(--band-ink);background:rgba(255,255,255,.07)}
nav.tabs a:focus-visible{outline-color:var(--band-ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--amber-soft);color:var(--ink);font-size:.92rem}
.banner.err{background:var(--bad-soft)}
section.view{margin-top:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h2{font-family:var(--f-display);font-weight:700;font-size:1.7rem;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;display:flex;align-items:center;gap:10px}
.head h2::before{content:"";width:6px;height:1.1em;background:var(--red);border-radius:2px;flex:none}
.head p{margin:2px 0 0;color:var(--muted);font-size:.9rem;max-width:62ch}
h3{font-family:var(--f-display);font-weight:600;font-size:1.15rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px;color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.inline{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
select,input,textarea{max-width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-width:0}
textarea{resize:vertical;min-height:90px;width:100%}
button{font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.danger.armed{background:var(--bad);color:var(--surface)}
button.small{padding:3px 8px;font-size:.8rem}
button:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:var(--r);padding:12px 14px}
.kpi .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel .tbl{border:0;border-radius:0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.panel th{background:transparent}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.85rem}
td.name{font-weight:600}
td .sub{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.grs{display:inline-flex;gap:4px;flex-wrap:wrap}
.gr{display:inline-flex;align-items:baseline;gap:3px;font-family:var(--f-data);font-weight:700;font-size:.9rem;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink);white-space:nowrap;line-height:1.3}
.gr i{font-style:normal;font-size:.62rem;letter-spacing:.06em;color:var(--muted);font-family:var(--f-body)}
.gr sup{font-size:.6rem;color:var(--muted);margin-left:1px}
.gr.g7{background:var(--red);color:#fff}.gr.g7 i,.gr.g7 sup{color:#ffd9de}
.gr.g6{background:var(--good-soft);color:var(--good)}
.gr.g5{background:var(--warn-soft);color:var(--warn)}
.metric .gr.gbig{font-size:1.25rem;padding:1px 9px;font-family:var(--f-display)}
.metric .msrc.gsrc{white-space:normal;overflow:visible}
th.gcol,td.gcol{text-align:center;width:96px}
td.gcol .grs{justify-content:center}
.gr.ov{font-family:var(--f-data);font-size:.85rem;font-variant-numeric:tabular-nums;min-width:86px;justify-content:center;padding:3px 8px;gap:5px}
.gr.ov i{font-family:var(--f-data);font-size:.68rem;font-weight:700}.gr.sm{font-size:.74rem;padding:1px 5px;opacity:.9}
.ovline{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:4px}
.ovline>div{display:flex;flex-direction:column;gap:2px;font-size:.85rem}.ovline .gr.gbig{font-size:1.6rem;padding:2px 12px}
.tnote{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;font-size:.78rem}
.tnote p{margin:0 0 2px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);line-height:1.35}
.tn-meta{display:block;font-size:.66rem;color:var(--muted)}
.tn-add{background:none;border:0;padding:2px 0;color:var(--red);font-weight:600;font-size:.74rem;cursor:pointer}
.tn-add:hover{text-decoration:underline}
.tnote textarea{width:100%;box-sizing:border-box;font:inherit;font-size:.85rem;min-height:70px}
.tn-btns{display:flex;gap:6px;margin-top:6px}
.metrics .metric.tn-wide{grid-column:1/-1}
tr.fc-row.open td{background:var(--surface-2)}
.fc-caret{display:inline-block;width:14px;color:var(--red);font-size:.8rem}
.fc-new{color:var(--red);font-weight:700}
tr.fc-detail td{background:var(--surface-2);padding:4px 14px 16px}
.fc-dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.fc-dgrid dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 0;font-size:.85rem}
.fc-dgrid dt{color:var(--muted)}.fc-dgrid dd{margin:0;font-family:var(--f-data);overflow-wrap:anywhere}
.linkbtn{background:none;border:0;padding:0;color:var(--red);font:inherit;text-align:left;cursor:pointer;text-decoration:underline}
.fc-list{margin:0;padding-left:18px;font-size:.88rem;line-height:1.6}
@media (max-width:820px){.fc-dgrid{grid-template-columns:minmax(0,1fr)}}
.gflags{margin:10px 0 0;padding-left:18px;font-size:.8rem;color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.sample{background:var(--amber-soft);color:var(--amber)}
.var-pos{color:var(--good)} .var-neg{color:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.rank{font-family:var(--f-display);font-weight:700;font-size:1.4rem;width:52px;line-height:1.1}
.rank .mvmt{display:block;font-family:var(--f-data);font-weight:500;font-size:.7rem;letter-spacing:0}
.blurb{display:block;font-size:.8rem;color:var(--muted);max-width:52ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{display:flex;gap:4px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.note .who{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.note .who b{font-size:1.02rem}
.note .meta{font-size:.8rem;color:var(--muted)}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{font-family:var(--f-data);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.tool b{font-family:var(--f-body);font-weight:600;color:var(--muted);margin-right:4px;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
.fc-inputs{display:grid;grid-template-columns:minmax(0,280px);gap:12px;margin-bottom:16px}
.fc-inputs label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fc-inputs input{font-family:var(--f-data)}
input.cell{width:72px;font-family:var(--f-data);text-align:right;padding:3px 6px}
select.cell{padding:3px 6px;font-size:.82rem}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,16,18,.5)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0}
.dlg-b{padding:16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dlg-b .full{grid-column:1/-1}
.dlg-b label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted)}
.dlg-b fieldset{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin:0}
.dlg-b legend{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0 4px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{flex-direction:row;align-items:center;font-weight:400;color:var(--ink);font-size:.88rem}
.dlg-f{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.staffpick{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.staffpick summary{cursor:pointer;padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:700;font-size:.9rem;list-style:none}
.staffpick summary::-webkit-details-marker{display:none}
.staffpick summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.staffpick[open] summary::before{transform:rotate(90deg)}
.staffpick summary .muted{font-weight:400;font-size:.82rem;min-width:0;overflow-wrap:anywhere}
.sp-legend{padding:0 12px 6px;font-size:.8rem;color:var(--muted);line-height:1.9}
.sp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px;padding:4px 12px 12px}
.sp-row{flex-direction:row!important;align-items:flex-start;gap:8px!important;font-weight:400!important;color:var(--ink)!important;font-size:.88rem!important;padding:4px 0}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric{background:var(--surface-2);border-radius:var(--r);padding:8px 10px}
.metric .lab,.blurb-full .lab{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.metric .mv2{font-family:var(--f-display);font-weight:700;font-size:1.45rem;font-variant-numeric:tabular-nums}
.metric .msrc{font-size:.66rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .mv2 span{font-family:var(--f-body);font-weight:400;font-size:.72rem;color:var(--muted)}
.blurb-full{margin-top:12px}.blurb-full p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.vid{display:flex;flex-direction:column;gap:6px;min-width:0}
.vid video,.vid img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:var(--r);max-width:100%}
.vid-link{display:flex;flex-direction:column;justify-content:center;aspect-ratio:16/9;padding:12px;border:1px dashed var(--line);border-radius:var(--r);color:var(--accent);font-weight:700;text-decoration:none;background:var(--surface-2);overflow-wrap:anywhere}
.vid-meta{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:.82rem}
.uploader{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.upbtn{display:inline-flex;align-self:flex-start;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.9rem;padding:7px 12px;border-radius:var(--r)}
.upbtn.busy{opacity:.6;cursor:progress}
.upbtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.linkrow{display:flex;gap:6px;flex-wrap:wrap}.linkrow input{flex:1 1 180px}
@media (max-width:600px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.quick{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px;border-color:var(--accent)}
.quick select{min-width:240px;max-width:100%}
.dvlist{margin:0 0 8px;padding-left:18px;font-size:.88rem}.dvlist a{color:var(--accent)}
.sched-list{display:flex;flex-direction:column;gap:10px}
.sched{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sched-date{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);padding-right:12px;line-height:1}
.sched-date .m{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.sched-date .d{font-family:var(--f-display);font-weight:700;font-size:2rem}
.sched-date .w{font-size:.72rem;color:var(--muted)}
.sched-name{margin:0 0 2px;font-size:1.15rem;text-transform:none;letter-spacing:.01em}
.sched-team{margin-top:6px;font-size:.84rem;line-height:1.9}
.sched-team .who{color:var(--ink)}
.sched-mark .lab{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg-b{border:0;border-radius:0;border-right:1px solid var(--line);padding:7px 11px;font-size:.84rem;background:var(--surface)}
.seg-b:last-child{border-right:0}
.seg-b.on.good{background:var(--good);color:var(--surface)}
.seg-b.on.warn{background:var(--warn);color:var(--surface)}
.seg-b.on.bad{background:var(--bad);color:var(--surface)}
@media (max-width:700px){.sched{grid-template-columns:56px minmax(0,1fr)}.sched-mark{grid-column:1/-1}.seg{width:100%}.seg-b{flex:1}}
tr.mhead td{background:var(--band);color:var(--band-ink);border-bottom:2px solid var(--red);font-size:.82rem;padding:6px 10px;position:sticky;left:0}
tr.mhead b{font-family:var(--f-display);font-size:1rem;text-transform:uppercase;letter-spacing:.06em;margin-right:10px}
tr.mhead span{color:var(--band-muted);font-family:var(--f-data);font-size:.78rem}
.aag{display:inline-flex;align-items:center;gap:3px;vertical-align:2px;margin-left:6px;padding:1px 7px 1px 5px;border-radius:999px;background:var(--band);color:#fff;border:1px solid var(--red);font-family:var(--f-display);font-weight:700;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;line-height:1.5}
.fgb{display:inline-flex;align-items:center;gap:4px;vertical-align:1px;margin-left:6px;padding:1px 8px 1px 3px;border-radius:999px;background:#0A0A0B;color:#fff;box-shadow:inset 0 -2px 0 var(--red);font-family:var(--f-display);font-weight:700;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;line-height:1.5}
.fgb img{height:15px;width:auto;max-width:none;display:block}
.head h2 .fgb{font-size:.8rem;vertical-align:middle}
.aag svg{width:10px;height:10px;fill:var(--red)}
.head h2 .aag{font-size:.8rem;vertical-align:middle}
.brand-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.viewas{display:flex;align-items:center;gap:0;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:2px;font-size:.78rem}
.viewas span{color:var(--band-muted);padding:0 8px 0 10px;text-transform:uppercase;letter-spacing:.08em;font-size:.68rem}
.viewas button{background:transparent;border:0;color:var(--band-muted);border-radius:999px;padding:4px 10px;font-size:.78rem}
.viewas button[aria-pressed="true"]{background:#fff;color:var(--band)}
.viewas button:focus-visible{outline-color:#fff}
.banner.pt{background:var(--band);color:#fff;border-left:4px solid var(--red)}
.banner.pt button{background:#fff;color:var(--band);border-color:#fff}
.access-help{margin-bottom:18px}
.access-help summary{cursor:pointer;font-size:.92rem}
.access-help ol{margin:10px 0 0;padding-left:20px;font-size:.9rem;line-height:1.55}
.note-vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.note-vids video,.note-vids img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:var(--r);max-width:100%}
.small-link{aspect-ratio:auto;padding:8px 10px;font-size:.85rem}
.dvlist.nv{list-style:none;padding:0}.dvlist.nv li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:6px}
.emg{background:var(--surface-2);border-radius:var(--r);padding:8px 10px}
.emg .lab{margin-bottom:4px;color:var(--red);font-weight:700}
.em{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;padding:2px 0}
.em span{color:var(--muted)}.em b{font-family:var(--f-data);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.em i{font-style:normal;color:var(--muted);font-size:.75rem}
.evm{border-top:1px solid var(--line);padding-top:10px}
.tracker{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:var(--r);overflow:hidden}
.trk{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;padding:7px 14px;cursor:pointer;min-width:0}
.trk b{font-family:var(--f-display);font-size:1.35rem;line-height:1.05;font-variant-numeric:tabular-nums}
.trk span{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.trk:hover{background:var(--surface-2)}.trk.on{background:var(--band);color:#fff}.trk.on span{color:var(--band-muted)}
.trk-show{margin-left:auto;align-self:center;padding:7px 14px;font-size:.82rem;color:var(--muted)}.trk-show b{color:var(--ink);font-variant-numeric:tabular-nums}
.filt-on{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin:0 0 10px;padding:6px 10px;background:var(--warn-soft);border-radius:var(--r);font-size:.85rem}
.pager{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 10px}
.pager.bottom{margin:10px 0 0}
.pager button{padding:4px 10px;font-size:.84rem;min-width:36px;font-variant-numeric:tabular-nums}
.pager button.on{background:var(--band);color:#fff;border-color:var(--band)}
.pg-gap{padding:0 4px;color:var(--muted)}
.pg-info{margin-left:auto;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.head p.chips-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.pbrlink{font-size:.8rem;font-weight:600;color:var(--red)}
.head>div,.toolbar,.toolbar>*{min-width:0;max-width:100%}
.err-msg{color:var(--bad);font-size:.85rem;grid-column:1/-1}
.subhead{grid-column:1/-1;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.95rem;border-bottom:1px solid var(--line);padding-bottom:2px;margin-top:4px}
.muted{color:var(--muted)}
.sec-gap{margin-top:22px}
@media (max-width:820px){.kpis,.fc-inputs{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.dlg-b{grid-template-columns:minmax(0,1fr)}.kpi .val{font-size:1.6rem}}
.gate{max-width:440px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:var(--r);padding:28px 26px;text-align:center}
.gate h2{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;font-size:1.6rem}
.gate p{color:var(--muted);margin:0 0 18px}
.login{display:flex;flex-direction:column;gap:10px;text-align:left}
.login label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted)}
.login input{font-size:1rem;padding:9px 10px}
.login button.primary{padding:10px;font-size:1rem}
.login .msg{font-size:.85rem;min-height:1.2em;margin:0}.login .msg.err{color:var(--bad)}
.linkish{background:none;border:0;padding:0;color:var(--red);font-weight:600;font-size:.85rem;cursor:pointer;align-self:flex-start}
.signout{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--band-muted);border-radius:999px;padding:3px 10px;font-size:.75rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function calc(e){
  const done=e.status==="Completed", hasRev=has(e.netRevenue);
  const regs=n(e.actualPlayers);
  const revenue=hasRev?n(e.netRevenue):regs*n(e.fee)+n(e.otherRevenue);
  const expenses=EXP.reduce((s,[k])=>s+n(e[k]),0);
  const actual=done||hasRev;
  return {done,actual,hasRev,regs,gross:hasRev?n(e.grossRevenue):revenue,disc:n(e.discounts),cred:n(e.credits),revenue,expenses,net:revenue-expenses,
    bRev:n(e.budgetRevenue),bExp:n(e.budgetExpenses),bNet:n(e.budgetRevenue)-n(e.budgetExpenses),bPlayers:n(e.budgetPlayers),aPlayers:regs,hasBudget:has(e.budgetRevenue)||has(e.budgetExpenses)};
}

const FC_BRANDS=["Open ID","State Games","Scout Day","Invite Only","Rising Stars"];
const FC_MON=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const FC_MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fcMonIdx=r=>{const t=String(r.month||"").toLowerCase().replace(/[^a-z]/g," ").trim().split(/\s+/)[0]||"";const i=FC_MON.indexOf(t.slice(0,3));if(i>=0)return i;return r.date?Number(r.date.slice(5,7))-1:99};
const fcRows=()=>(S.fc27||[]).slice().sort((a,b)=>fcMonIdx(a)-fcMonIdx(b)||String(a.date||"9999").localeCompare(String(b.date||"9999"))||String(a.name).localeCompare(String(b.name)));
const fcLY=r=>r.lyEvent?S.events.find(e=>e.name===r.lyEvent):null;
const fcAct=r=>{const e=r.eventId?byId("events",r.eventId):null;if(!e)return null;const c=calc(e);return{e,regs:c.regs,gross:c.gross,net:c.revenue}};
const fcTotal=r=>has(r.total)?n(r.total):n(r.players)*n(r.avg);
const fcOverdue=r=>!r.booked&&r.due&&r.due<todayISO();
const pctChip=(a,b)=>{if(!b)return"";const v=(a-b)/b*100;return `<span class="${v>=0?"var-pos":"var-neg"}">${pct(v)}</span>`};
function fcSum(list){const T={n:list.length,p:0,t:0,ap:0,at:0,lyp:0,lyt:0,lyn:0,booked:0,linked:0};
  list.forEach(r=>{T.p+=n(r.players);T.t+=fcTotal(r);if(r.booked)T.booked++;const a=fcAct(r);if(a){T.linked++;T.ap+=a.regs;T.at+=a.gross}
    const ly=fcLY(r);if(ly){const c=calc(ly);T.lyp+=c.regs;T.lyt+=c.gross;T.lyn++}});return T}

/* ---------- 20–80 grading engine (PBR PA rules) ---------- */
const GRADE_RULES_VERSION="2026-10-01";
const gClamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r5=x=>Math.round(x/5)*5;
const rh=x=>Math.floor(Number(x)+0.5);
const gNum=v=>{if(v==null||v==="")return null;const x=parseFloat(String(v).replace(/,/g,""));return isFinite(x)?x:null};
const GT={
  power:v=>{v=rh(v);return v<75?20:v<=84?30:v<=90?40:v<=95?50:v<=99?60:v<=104?70:80},
  run:s=>{s=Math.round(s*100)/100;return s>=8?20:s>=7.6?30:s>=7.31?40:s>=7?50:s>=6.76?60:s>=6.51?70:80},
  velo:v=>{v=rh(v);return v<=74?20:v<=78?30:v<=81?40:v<=84?50:v<=88?60:v<=94?70:80},
  cvelo:v=>{v=rh(v);return v<=69?20:v<=72?30:v<=75?40:v<=79?50:v<=82?60:v<=86?70:80},
  fbspin:v=>{v=rh(v);return v<1800?20:v<1925?30:v<2000?40:v<2100?50:v<2200?60:v<2300?70:80},
  cbspin:v=>{v=rh(v);return v<1850?20:v<2000?30:v<2125?40:v<2275?50:v<2400?60:v<2550?70:80},
  slspin:v=>{v=rh(v);return v<1800?20:v<1950?30:v<2075?40:v<2200?50:v<2350?60:v<2500?70:80},
  chsep:d=>{return d<=3?20:d<=5?30:d<=7?40:d===8?50:d===9?60:70}
};
const OFP_W={C:[25,20,5,25,25],SSCF:[25,15,20,15,25],MID:[30,25,15,15,15],CORNER1:[35,35,10,5,15]};
const P_TOK=new Set(["RHP","LHP","P","SHP","RP","SP"]);
const POS_INFO=t=>{
  if(t==="C")return{grp:"C",arm:"c"};
  if(t==="SS"||t==="CF"||t==="MIF"||t==="MI")return{grp:"SSCF",arm:t==="CF"?"of":"if"};
  if(t==="1B"||t==="DH")return{grp:"CORNER1",arm:t==="DH"?null:"if"};
  if(["2B","3B","IF","INF","CIF","UT"].includes(t))return{grp:"MID",arm:"if"};
  if(["LF","RF","OF"].includes(t))return{grp:"MID",arm:"of"};
  return null};
const ofpTier=x=>x>=75?80:x>=65?70:x>=55?60:x>=45?50:x>=35?40:x>=25?30:20;
const topOf=r=>{if(r==null||r==="")return null;const m=String(r).match(/[\d.]+/g);return m?Math.max(...m.map(Number)):null};
function gradeCutoff(asOf){const d=asOf?new Date(asOf+"T12:00:00"):new Date();d.setFullYear(d.getFullYear()-1);return d.toISOString().slice(0,10)}
function gradePlayer(p,asOf){
  const cut=gradeCutoff(asOf), flags=[];
  const evs=(Array.isArray(p.eventMetrics)?p.eventMetrics:[]);
  const recent=evs.filter(e=>e&&e.date&&e.date>=cut);
  const best={};
  const take=(k,v,e,hi)=>{v=gNum(v);if(v==null)return;const c=best[k];if(!c||(hi?v>c.v:v<c.v))best[k]={v,src:e.event||"Event",date:e.date||""}};
  recent.forEach(e=>{
    take("ev",Math.max(gNum(e.evMax)||0,gNum(e.exitVelo)||0)||null,e,1);
    take("sixty",e.sixty,e,0);
    take("inf",e.infVelo,e,1);take("of",e.ofVelo,e,1);take("c",e.cVelo,e,1);
    const fb=Math.max(gNum(e.fbMax)||0,gNum(e.fbVelo)||0)||null;take("fb",fb,e,1);
    take("fbSpin",e.fbSpin,e,1);take("cbSpin",e.cbSpin,e,1);take("slSpin",e.slSpin,e,1);
    const ch=topOf(e.chRange);if(fb&&ch){const before=best.chSep;take("chSep",rh(fb)-rh(ch),e,1);if(best.chSep!==before)best.chVelo={v:ch,src:e.event||"Event",date:e.date||""}}
  });
  /* manually entered values (no event history for that metric) */
  const hasAny=k=>evs.some(e=>e&&e[k]!=null&&e[k]!=="");
  [["ev","exitVelo",["evMax","exitVelo"]],["sixty","sixty",["sixty"]],["inf","infVelo",["infVelo"]],["of","ofVelo",["ofVelo"]],["c","cVelo",["cVelo"]],["fb","fbVelo",["fbMax","fbVelo"]]].forEach(([k,top,eks])=>{
    if(!best[k]&&gNum(p[top])!=null&&!eks.some(hasAny))best[k]={v:gNum(p[top]),src:"Entered on profile",date:""}});
  const ev=e=>e?e.v:null;
  /* evaluator inputs */
  const adj=k=>{const v=gNum(p[k]);return v==null?null:gClamp(v,-5,5)};
  const evalG=k=>{const v=gNum(p[k]);return v==null?null:gClamp(r5(v),20,80)};
  /* positions */
  const toks=String(p.position||"").toUpperCase().split(/[\/.,\s]+/).filter(Boolean);
  const isP=toks.some(t=>P_TOK.has(t));
  const hTok=toks.find(t=>!P_TOK.has(t)&&POS_INFO(t));
  /* ---- hitter line ---- */
  let H=null;
  const hasHitData=best.ev||best.sixty||best.inf||best.of||best.c;
  if(hTok||(!isP&&hasHitData)||(isP&&best.ev)){
    let info=hTok?POS_INFO(hTok):null;
    if(!info){const a=best.inf?"if":best.of?"of":best.c?"c":null;info={grp:"MID",arm:a};
      flags.push(isP?`Hitter line from ${p.position} hitting data (no field position listed): 2B/3B/LF/RF weights${a?`, Arm from ${a==="c"?"C":a.toUpperCase()} velo`:""}`:`No position on file: 2B/3B/LF/RF weights${a?`, Arm from ${a==="c"?"C":a.toUpperCase()} velo`:", no Arm grade"}`)}
    const t={};
    t.hit=evalG("hitEval");
    if(best.ev)t.power=gClamp(r5(GT.power(best.ev.v)+(adj("powerAdj")||0)),20,80);
    if(best.sixty)t.run=gClamp(r5(GT.run(best.sixty.v)+(adj("runAdj")||0)),20,80);
    const armM=info.arm==="c"?best.c:info.arm==="of"?best.of:info.arm==="if"?best.inf:null;
    if(armM)t.arm=gClamp(r5((info.arm==="c"?GT.cvelo(armM.v):GT.velo(armM.v))+(adj("armAdj")||0)),20,80);
    t.field=evalG("fieldEval");
    if(t.field!=null&&info.grp==="SSCF"&&t.run!=null&&t.field>t.run+15){t.field=t.run+15;flags.push(`Field capped at Run + 15 (${t.field}) for ${hTok}`)}
    if(t.hit==null)flags.push("Missing Hit eval");
    if(t.field==null)flags.push("Missing Field eval");
    if(!best.sixty)flags.push("No 60 time: no Run grade");

async function handleUpload(files,pid){
  const p=byId("players",pid||UI.profile);if(!p||!assetsNS||upState.busy)return;
  const ok=VID_OK;
  upState.busy=true;upState.msg="";upState.err=false;render();
  let added=0;const errs=[];
  for(const f of files){
    let type=f.type; if(!type&&/\.mp4$/i.test(f.name))type="video/mp4"; if(!type&&/\.webm$/i.test(f.name))type="video/webm";if(!type&&/\.mov$/i.test(f.name))type="video/quicktime";
    if(!ok.includes(type)){errs.push(`${f.name}: ${/\.mov$/i.test(f.name)||type==="video/quicktime"?"file type isn't supported.":"file type isn't supported. Use a video or photo file."}`);continue}
    if(f.size>500*1048576){errs.push(`${f.name}: ${(f.size/1048576).toFixed(0)} MB is over the 500 MB limit. Trim it or add a link.`);continue}
    try{const r=await assetsNS.upload(f,{type});const cur=byId("players",p.id);const vids=(Array.isArray(cur.videos)?cur.videos:[]).concat({id:r.id,url:r.url,name:f.name,type:r.contentType,sizeBytes:r.sizeBytes,addedAt:new Date().toISOString()});
      await saveVideos(cur,vids);(cur.videos=vids);added++}
    catch(e){const c=e&&e.code;errs.push(`${f.name}: `+(c==="too_large"?"over the 500 MB limit.":c==="unsupported_type"?"file type isn't supported.":c==="quota_or_state"?"storage is full.":c==="rate_limited"?"too many uploads at once. Wait a moment and try again.":"upload failed. Try again."))}
  }
  upState.busy=false;upState.err=errs.length>0;upState.msg=(added?`${added} file${added>1?"s":""} saved. `:"")+errs.join(" ");render();dlgVideoRefresh();
}

document.addEventListener("change",async e=>{
  const t=e.target,id=t.id;
  const map={"ov-season":"season","ev-season":"evSeason","tk-status":"taskStatus","tk-who":"taskWho","tk-event":"taskEvent","rk-class":"rkClass","rk-state":"rkState","nt-player":"ntPlayer","nt-scout":"ntScout","ev-type":"evType","ev-month":"evMonth"};
  if(map[id]){UI[map[id]]=t.value;saveUI();render();return}
  if(id==="rk-ver"){if(t.value==="__new"){t.value=UI.rkVer||"";if(!db)return;try{await rkNewDraft()}catch(err){alert(errText(err))}return}UI.rkVer=t.value;saveUI();render();return}
  if(id==="rk-class"){UI.rkClass=t.value;UI.rkVer="";saveUI();render();return}
  if(id==="rk-addp"&&t.value){const d=rkActive();if(!d||!db)return;const ord=rkOrder(d);const ranks=Object.assign({},d.ranks);ranks[t.value]=(ord.length?ord[ord.length-1].r:0)+1;d.ranks=ranks;render();try{await rkSaveDraft(d,ranks)}catch(err){alert(errText(err))}return}
  if(id==="vid-file"){handleUpload([...t.files]);t.value="";return}
  if(id==="sc-me"||id==="sc-show"){UI[id==="sc-me"?"schedMe":"schedShow"]=t.value;saveUI();render();return}
  if(id==="pr-open"&&t.value){UI.profileFrom="prospects";UI.profile=t.value;vidDelArm=null;upState.msg="";render();window.scrollTo(0,0);return}
  if(id==="pr-rank"){UI.prRank=t.value;UI.prPage=1;saveUI();render();return}
  if(id==="pr-sort"){UI.prSort=t.value;UI.prPage=1;saveUI();render();return}
  if(id==="pr-class"||id==="pr-state"){UI.prPage=1;UI[id==="pr-class"?"prClass":"prState"]=t.value;saveUI();render();return}
  if(id==="nt-follow"){UI.ntFollow=t.checked;saveUI();render();return}
  if(id==="fc-brand"||id==="fc-month"||id==="fc-state"||id==="fc-status"){UI[{"fc-brand":"fcBrand","fc-month":"fcMonth","fc-state":"fcState","fc-status":"fcStatus"}[id]]=t.value;UI.fcOpen=null;saveUI();render();return}
  if(t.dataset.fc){const v=parseFloat(t.value);await saveFc({[t.dataset.fc]:isFinite(v)?v:0});return}
  if(t.dataset.fcg){const v=t.value.trim();try{await db.collection("events").doc(t.dataset.fcg).update({fcGrowth:v===""?null:parseFloat(v)})}catch(err){}return}
  if(t.dataset.status){try{await db.collection("tasks").doc(t.dataset.status).update({status:t.value})}catch(err){}return}
});
let fcBusy=Promise.resolve();
function saveFc(patch){
  Object.assign(S.fc,patch);render();
  fcBusy=fcBusy.then(()=>db.doc("settings/forecast").set(Object.assign({},S.fc))).catch(()=>{});
  return fcBusy;
}

/* ---------- boot ---------- */
UI.tab=VIEWS[location.hash.slice(1)]?location.hash.slice(1):(VIEWS[UI.tab]?UI.tab:"overview");
render();
function gate(html){gated=true;document.getElementById("tabs").hidden=true;view.innerHTML=`<div class="gate">${html}</div>`}
(async()=>{
  const sync=document.getElementById("sync");
  const C=window.DUGOUT_CONFIG||{};
  if(!window.firebase||!C.firebase||!C.firebase.apiKey){dbState="off";sync.textContent="Not configured";gate("<h2>Setup needed</h2><p>Add the Firebase settings to config.js.</p>");return}
  firebase.initializeApp(C.firebase);
  const auth=firebase.auth(), fs=firebase.firestore();
  let started=false;
  const loginForm=(msg,err)=>`<h2>The Dugout</h2><p>Prep Baseball Pennsylvania staff only.</p>
    <form class="login" id="login" autocomplete="on"><label>Email<input type="email" id="lg-email" autocomplete="username" required></label>
    <label>Password<input type="password" id="lg-pass" autocomplete="current-password" required></label>
    <button class="primary" type="submit" id="lg-go">Sign in</button><button class="linkish" type="button" id="lg-reset">Forgot password?</button>
    <p class="msg${err?" err":""}" id="lg-msg" role="status">${esc(msg||"")}</p></form>`;
  const showLogin=(msg,err)=>{gate(loginForm(msg,err));const f=document.getElementById("login"),m=document.getElementById("lg-msg"),em=document.getElementById("lg-email");
    const say=(t,e)=>{m.textContent=t;m.className="msg"+(e?" err":"")};
    f.onsubmit=ev=>{ev.preventDefault();const go=document.getElementById("lg-go");go.disabled=true;say("Signing in…");
      auth.signInWithEmailAndPassword(em.value.trim(),document.getElementById("lg-pass").value).catch(e=>{go.disabled=false;
        const c=e&&e.code||"";say(/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c)?"That email and password don't match. Try again or reset your password.":c==="auth/too-many-requests"?"Too many tries. Wait a few minutes or reset your password.":"Couldn't sign in: "+(e&&e.message||"unknown error"),true)})};
    document.getElementById("lg-reset").onclick=()=>{const e=em.value.trim();if(!e){say("Enter your email above, then click Forgot password.",true);em.focus();return}
      auth.sendPasswordResetEmail(e).then(()=>say("If that email has an account, a reset link is on its way. Check spam too.")).catch(()=>say("If that email has an account, a reset link is on its way. Check spam too."))};
    em.focus()};
  const addSignOut=email=>{const meta=document.querySelector(".brand-right");if(!meta||document.getElementById("signout"))return;const b=document.createElement("button");b.id="signout";b.type="button";b.className="signout";b.title=email;b.textContent="Sign out";b.onclick=()=>auth.signOut().then(()=>location.reload());meta.appendChild(b)};
  auth.onAuthStateChanged(async user=>{
    if(!user){dbState="off";sync.textContent="Signed out";showLogin();return}
    if(started)return;
    const email=String(user.email||"").toLowerCase();
    addSignOut(email);
    const owners=(C.owners||[]).map(x=>String(x).toLowerCase());
    let level=owners.includes(email)?"Full":null;
    if(!level){try{const a=await fs.collection("access").doc(email).get();if(a.exists)level=a.data().level==="Full"?"Full":"Partial"}catch(e){}}
    if(!level){dbState="off";sync.textContent="No access";gate(`<h2>Not on the staff list</h2><p>${esc(email)} doesn't have access to The Dugout yet. Ask Nathan to add this email on the Staff tab.</p><button type="button" id="g-out">Sign out</button>`);document.getElementById("g-out").onclick=()=>auth.signOut();return}
    started=true;gated=false;ME_EMAIL=email;
    document.getElementById("tabs").hidden=false;
    db=fs;dbState="on";canWrite=true;isFull=level==="Full";
    if(isFull)document.getElementById("viewas").hidden=false;
    if(!isFull&&FT_ONLY.includes(UI.tab)){UI.tab="schedule";try{history.replaceState(null,"","#schedule")}catch(x){}}
    try{const st=firebase.storage();assetsNS={
      upload:async(file,o)=>{const id="media/"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)+"-"+String(file.name||"file").replace(/[^\w.-]+/g,"_");const ref=st.ref(id);const snap=await ref.put(file,{contentType:(o&&o.type)||file.type});const url=await ref.getDownloadURL();return{id,url,contentType:snap.metadata.contentType,sizeBytes:snap.metadata.size}},
      delete:async id=>{await st.ref(id).delete()}};
      if(C.storage===false)assetsNS=null;}catch(e){assetsNS=null}
    render();
    const CLS=["2027","2028","2029","2030"], parts={};
    const mergePlayers=()=>{setPlayers([].concat(...Object.values(parts)));loaded.players=Object.keys(parts).length>=CLS.length+1;sync.textContent="Live · shared with your team";render()};
    const paused=()=>{sync.textContent="Sync paused. Reload to reconnect."};
    CLS.map(y=>[y,db.collection("players").where("gradYear","==",y)]).concat([["other",db.collection("players").where("gradYear","not-in",CLS)]]).forEach(([k,q])=>{
      q.onSnapshot(snap=>{parts[k]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));mergePlayers()},paused);
    });
    COLS.filter(c=>c!=="players"&&(isFull||!["events"].includes(c))).forEach(c=>{
      db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));loaded[c]=true;
        sync.textContent="Live · shared with your team";render();if(c==="staff"&&isFull)syncAccess()},paused);
    });
    if(!isFull)loaded.events=true;
    if(isFull)db.collection("settings").onSnapshot(snap=>{const k={};const fr=[];const rd=[];let fm={};snap.docs.forEach(d=>{const v=d.data()||{};if(d.id==="forecast")S.fc=Object.assign({},S.fc,v);else if(d.id.indexOf("kpi-")===0)k[d.id.slice(4)]=v;else if(d.id==="fc27-meta")fm=v;else if(d.id.indexOf("fc27-")===0)fr.push(Object.assign({id:d.id},v));else if(d.id.indexOf("rkdraft-")===0)rd.push(Object.assign({id:d.id},v))});S.rkDrafts=rd;S.kpi=k;S.fc27=fr;S.fc27meta=fm;loaded.fc27=true;render()},()=>{});
    /* Staff tab drives who can sign in: each staff email with Access = Full or Partial gets an access record. */
    let accBusy=false;
    async function syncAccess(){if(accBusy)return;accBusy=true;try{
      const want={};S.staff.forEach(st=>{const e=String(st.email||"").trim().toLowerCase();if(e&&(st.access==="Full"||st.access==="Partial"))want[e]=st.access});
      const have={};(await db.collection("access").get()).docs.forEach(d=>have[d.id]=(d.data()||{}).level);
      for(const [e,l] of Object.entries(want))if(have[e]!==l)await db.collection("access").doc(e).set({level:l,updatedAt:new Date().toISOString()});
      for(const e of Object.keys(have))if(!want[e]&&!owners.includes(e))await db.collection("access").doc(e).delete();
    }catch(e){}finally{accBusy=false}}
  });
})();
})();
</script>
